<!DOCTYPE html>
<html>
<head>
    <title>Server Monitoring</title>
</head>
<body>

    <h1>{{application_name}}</h1>
    <p>{{message}}</p>

    <h2>Servers</h2>
    <ul>
        {% for server in servers %}
            <li>{{ server.name }} - {{ server.status }}</li>
        {% endfor %}
    </ul>

</body>
</html>
